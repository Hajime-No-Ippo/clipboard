<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Deliberately NO theme-color. With one set, Safari 26 paints the top and
         bottom bar areas as solid opaque slabs of that colour — the big flat
         squares sitting on the corkboard. Without it, Safari samples the page,
         and since the safe-area padding keeps all content clear of the bars,
         what it samples is pure cork: the board continues under the chrome,
         lightly frosted. Sampling only looked bad before the padding existed,
         when footer text sat in the sampled region. -->
    <!-- No color-scheme meta: "dark" made iOS paint the keyboard-gap canvas
         black (beating the cork background-color) and styled form controls
         dark on a light page. Default light matches the board. -->

    <!-- PWA. Installed to the home screen the app runs standalone: no Safari
         toolbar, no pill, no bar tinting — the whole saga above simply does not
         apply. black-translucent lets the page render its real pixels under the
         status bar, so the cork runs edge to edge, unfrosted. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clipboard" />
    <title>Clipboard — paste here, read there</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
