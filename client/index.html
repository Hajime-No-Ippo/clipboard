<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- viewport-fit=cover opts into the full screen so the safe-area insets
         below report real values; without it they are all 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Safari 26 runs the page under translucent toolbars and paints them a
         solid colour from theme-color (with none set it samples and blurs the
         page instead, which smears the cork texture). Page content cannot render
         there, so the aim is a band that reads as a continuation of the board.

         Not the raw cork: the vignette overlay in App.jsx lightens the page, so
         the edge the eye compares against is cork blended with that highlight.
         Matching raw cork gives a band visibly darker than the board. -->
    <meta name="theme-color" content="#b8834f" />
    <title>Clipboard — paste here, read there</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
